name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  attestations: read

jobs:
  checks:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target

      - name: Soroban CLI
        uses: stellar/stellar-cli@v27.0.0

      - name: Build ProjectRegistry WASM dependency
        run: stellar contract build --package project-registry
        working-directory: contracts

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run tests/unit
        env:
          NEXTAUTH_SECRET: ci-test-secret
          NEXTAUTH_URL: http://localhost:3000

      - name: Integration tests
        run: npm run test -- --run tests/integration
        env:
          NEXTAUTH_SECRET: ci-test-secret
          NEXTAUTH_URL: http://localhost:3000

      - name: Contract tests
        run: cargo test --locked --workspace -- --nocapture
        working-directory: contracts

      - name: Build Rust contracts
        run: stellar contract build --package sponsorship-manager
        working-directory: contracts

      - name: Verify WASM artifacts
        run: |
          test -s contracts/target/wasm32v1-none/release/project_registry.wasm
          test -s contracts/target/wasm32v1-none/release/sponsorship_manager.wasm

      - name: Build frontend
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-build-secret
          NEXTAUTH_URL: http://localhost:3000
          GITHUB_CLIENT_ID: ci_mock_id
          GITHUB_CLIENT_SECRET: ci_mock_secret
