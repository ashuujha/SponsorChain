name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sponsorchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sponsorchain_test?schema=public

      - name: Run Linter
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: npm run test -- --run
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sponsorchain_test?schema=public
          NEXTAUTH_SECRET: supersecret
          NEXTAUTH_URL: http://localhost:3000

      - name: Production Build Compilation
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sponsorchain_test?schema=public
          NEXTAUTH_SECRET: supersecret
          NEXTAUTH_URL: http://localhost:3000
          GITHUB_ID: mock_id
          GITHUB_SECRET: mock_secret
