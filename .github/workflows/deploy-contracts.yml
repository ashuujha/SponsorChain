name: Testnet release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sponsorchain-testnet-${{ github.ref }}
  cancel-in-progress: false

env:
  STELLAR_NETWORK: testnet
  SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
  HORIZON_URL: https://horizon-testnet.stellar.org
  STELLAR_IDENTITY: sponsorchain-deployer

jobs:
  deploy-and-verify:
    name: Build, deploy, verify, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Soroban CLI
        run: |
          cargo install --locked stellar-cli
          stellar --version

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run tests/unit
        env:
          NEXTAUTH_SECRET: ci-test-secret
          NEXTAUTH_URL: http://localhost:3000

      - name: Contract tests
        run: cargo test --locked --workspace -- --nocapture
        working-directory: contracts

      - name: Configure deployer identity
        env:
          STELLAR_SECRET: ${{ secrets.STELLAR_ACCOUNT_SECRET }}
        run: |
          test -n "$STELLAR_SECRET" || { echo "Missing required secret STELLAR_ACCOUNT_SECRET"; exit 1; }
          printf '%s\n' "$STELLAR_SECRET" | stellar keys add "$STELLAR_IDENTITY" --secret-key
          stellar keys address "$STELLAR_IDENTITY"

      - name: Build Rust contracts
        run: cargo build --locked --workspace --target wasm32v1-none --release
        working-directory: contracts

      - name: Verify WASM
        run: |
          test -s contracts/target/wasm32v1-none/release/project_registry.wasm
          test -s contracts/target/wasm32v1-none/release/sponsorship_manager.wasm
          stellar contract info interface --wasm contracts/target/wasm32v1-none/release/project_registry.wasm --output rust
          stellar contract info interface --wasm contracts/target/wasm32v1-none/release/sponsorship_manager.wasm --output rust

      - name: Deploy and initialize contracts
        run: ./scripts/deploy.sh --confirm-redeploy

      - name: Verify contract interfaces and initialization
        run: ./scripts/verify-deployment.sh .env.local

      - name: Integration tests with deployed configuration
        run: npm run test -- --run tests/integration
        env:
          NEXTAUTH_SECRET: ci-test-secret
          NEXTAUTH_URL: http://localhost:3000

      - name: Build frontend with generated configuration
        run: |
          set -a
          . ./deployment.env
          set +a
          npm run build
        env:
          NEXTAUTH_SECRET: ci-build-secret
          NEXTAUTH_URL: http://localhost:3000
          GITHUB_CLIENT_ID: ci_mock_id
          GITHUB_CLIENT_SECRET: ci_mock_secret

      - name: Deployment smoke test
        run: ./scripts/verify-deployment.sh .env.local

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: sponsorchain-testnet-deployment-${{ github.sha }}
          if-no-files-found: error
          path: |
            deployment.json
            deployment.env
            .env.local
            CONTRACTS.md

      - name: Verify required deployment outputs
        run: |
          test -s deployment.json
          test -s deployment.env
          grep -q '^NEXT_PUBLIC_PROJECT_REGISTRY_ADDRESS=C' deployment.env
          grep -q '^NEXT_PUBLIC_SPONSORSHIP_MANAGER_ADDRESS=C' deployment.env

  deploy-frontend:
    name: Build and deploy frontend
    needs: deploy-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated deployment configuration
        uses: actions/download-artifact@v4
        with:
          name: sponsorchain-testnet-deployment-${{ github.sha }}

      - name: Check Vercel secrets
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing required secret VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing required secret VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing required secret VERCEL_PROJECT_ID"; exit 1; }
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Node setup and packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build frontend from deployment artifact
        run: |
          set -a
          . ./deployment.env
          set +a
          npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Build Vercel artifact from deployment configuration
        run: |
          set -a
          . ./deployment.env
          set +a
          vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}

      - name: Deploy frontend
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
